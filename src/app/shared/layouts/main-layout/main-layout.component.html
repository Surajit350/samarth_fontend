<div class="flex h-screen bg-slate-50 dark:bg-slate-900 transition-colors duration-300 font-sans">
  
  <app-sidebar class="contents"></app-sidebar>

  <!-- Overlay for mobile when sidebar is open -->
  <div 
    *ngIf="layoutService.sidebarOpen$ | async" 
    (click)="layoutService.toggleSidebar()"
    class="fixed inset-0 z-10 bg-slate-900/50 lg:hidden backdrop-blur-sm transition-opacity"
  ></div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <app-header class="contents"></app-header>

    <!-- Page Content -->
    <main class="flex-1 flex flex-col overflow-x-hidden overflow-y-auto bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
      <div class="flex-1 p-6">
        <router-outlet></router-outlet>
      </div>
      <app-footer class="contents"></app-footer>
    </main>

  </div>
</div>
