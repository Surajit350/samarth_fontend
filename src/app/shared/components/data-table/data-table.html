<p-table #dt
  [columns]="columns" 
  [value]="data" 
  [paginator]="true" 
  [rows]="rows"
  [loading]="loading"
  [globalFilterFields]="globalFilterFields"
  styleClass="p-datatable-sm p-datatable-striped"
  [tableStyle]="{ 'min-width': '50rem' }"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
  [rowsPerPageOptions]="[10, 25, 50]">
  
  <ng-template pTemplate="caption" *ngIf="showFilter">
    <div class="flex justify-end mb-2">
      <div class="relative">
        <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input 
          type="text" 
          class="pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 w-64" 
          (input)="dt.filterGlobal($any($event.target).value, 'contains')" 
          placeholder="Search all columns..." />
      </div>
    </div>
  </ng-template>

  <ng-template pTemplate="header" let-columns>
    <tr>
      <th *ngFor="let col of columns" [pSortableColumn]="col.field" class="bg-slate-100 text-slate-700">
        <div class="flex items-center justify-between">
          {{ col.header }}
          <p-sortIcon [field]="col.field"></p-sortIcon>
        </div>
      </th>
    </tr>
  </ng-template>
  
  <ng-template pTemplate="body" let-rowData let-columns="columns">
    <tr>
      <td *ngFor="let col of columns">
        {{ rowData[col.field] }}
      </td>
    </tr>
  </ng-template>
  
  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="columns.length" class="text-center p-8 text-slate-500">
        <div class="flex flex-col items-center">
          <i class="pi pi-inbox text-3xl mb-2 text-slate-300"></i>
          <span>No records found.</span>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
